[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diffharbor-api"
version = "0.1.0"
description = "API for DiffHarbor's legacy change rehearsal workbench"
requires-python = ">=3.14,<3.16"
dependencies = [
  "alembic>=1.15,<2.0",
  "arq>=0.26,<1.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.8,<3.0",
  "httpx>=0.28,<1.0",
  "itsdangerous>=2.2,<3.0",
  "msgpack>=1.1,<2.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "PyYAML>=6.0.2,<7.0",
  "redis>=4.2,<6.0",
  "sqlalchemy[asyncio]>=2.0.38,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
