# Separate from render.yaml, which continues to publish the free read-only demo.
# This live stack includes paid API, worker, Postgres, and Redis-compatible services.
# Do not create this Blueprint until the service costs and GitHub App setup are approved.
services:
  - type: web
    name: diffharbor-live
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diffharbor-live-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: diffharbor-live-queue
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  - type: worker
    name: diffharbor-live-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: arq app.tasks.WorkerSettings
    shutdownTimeoutSeconds: 180
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diffharbor-live-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: diffharbor-live-queue
          type: keyvalue
          property: connectionString
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false

  - type: keyvalue
    name: diffharbor-live-queue
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: diffharbor-live-db
    databaseName: diffharbor
    user: diffharbor
    plan: 0.5c-1g
    diskSizeGB: 5
    postgresMajorVersion: "18"
    region: singapore
