name: DiffHarbor rehearsal
run-name: DiffHarbor rehearsal ${{ inputs.changeguard_run_id }}

on:
  workflow_dispatch:
    inputs:
      changeguard_run_id:
        description: DiffHarbor run identifier
        required: true
        type: string
      pull_request_number:
        description: Pull request number
        required: true
        type: string
      base_sha:
        description: Base commit SHA
        required: true
        type: string
      head_sha:
        description: Candidate commit SHA
        required: true
        type: string
      diffharbor_url:
        description: DiffHarbor service URL for this rehearsal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: changeguard-${{ inputs.changeguard_run_id }}
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      report_gzip_base64: ${{ steps.collect-report.outputs.report_gzip_base64 }}
    permissions:
      contents: read
    steps:
      - name: Check out trusted runner from the target default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: changeguard-control
          persist-credentials: false

      - name: Check out base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pull_request_number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Read Python version from trusted base configuration
        id: runtime
        continue-on-error: true
        env:
          BASE_CONFIG: baseline/changeguard.toml
        run: /usr/bin/python3 changeguard-control/integrations/github/runner.py --print-python-version "$BASE_CONFIG" >> "$GITHUB_OUTPUT"

      - name: Set up repository Python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.runtime.outputs.python_version || '3.12' }}

      - name: Run backend impact analysis and checks
        id: rehearsal
        continue-on-error: true
        env:
          CHANGEGUARD_RUN_ID: ${{ inputs.changeguard_run_id }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          /usr/bin/python3 changeguard-control/integrations/github/runner.py \
            --base baseline \
            --candidate candidate \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --config baseline/changeguard.toml \
            --run-id "$CHANGEGUARD_RUN_ID" \
            --output "$RUNNER_TEMP/changeguard-report.json"

      - name: Prepare report for the trusted publisher job
        if: always()
        id: collect-report
        env:
          REPORT_PATH: ${{ runner.temp }}/changeguard-report.json
        run: |
          if [ ! -f "$REPORT_PATH" ]; then
            echo "No completed report was available to publish."
            exit 0
          fi

          report_size=$(wc -c < "$REPORT_PATH")
          if [ "$report_size" -gt 524288 ]; then
            echo "Report exceeds the 512 KiB publishing limit."
            exit 1
          fi

          report_gzip_base64="$(gzip -c "$REPORT_PATH" | base64 -w 0)"
          if [ "${#report_gzip_base64}" -gt 480000 ]; then
            echo "Compressed report exceeds the GitHub job-output limit."
            exit 1
          fi
          printf 'report_gzip_base64=%s\n' "$report_gzip_base64" >> "$GITHUB_OUTPUT"

      - name: Set workflow result from candidate checks
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/changeguard-report.json
        run: |
          /usr/bin/python3 - "$REPORT_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("summary", {}).get("status") != "passed":
              raise SystemExit(1)
          PY

  publish:
    needs: rehearse
    if: always() && needs.rehearse.outputs.report_gzip_base64 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Publish signed report to DiffHarbor
        env:
          DIFFHARBOR_URL: ${{ inputs.diffharbor_url }}
          CHANGEGUARD_RUN_ID: ${{ inputs.changeguard_run_id }}
          REPORT_GZIP_BASE64: ${{ needs.rehearse.outputs.report_gzip_base64 }}
          REPORT_PATH: ${{ runner.temp }}/changeguard-report.json
        run: |
          printf '%s' "$REPORT_GZIP_BASE64" | base64 --decode | gzip --decompress > "$REPORT_PATH"
          set +x
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=diffharbor"
          identity_token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url" | /usr/bin/python3 -c "import json, sys; print(json.load(sys.stdin)['value'])")"
          curl --fail --silent --show-error \
            -X POST "${DIFFHARBOR_URL%/}/api/runs/${CHANGEGUARD_RUN_ID}/report" \
            -H "Authorization: Bearer ${identity_token}" \
            -H "Content-Type: application/json" \
            --data-binary "@${REPORT_PATH}"
