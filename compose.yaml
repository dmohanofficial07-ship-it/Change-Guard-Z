services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: changeguard
      POSTGRES_USER: changeguard
      POSTGRES_PASSWORD: changeguard
    ports:
      - "5432:5432"
    volumes:
      - changeguard-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changeguard -d changeguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - changeguard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  changeguard-postgres:
  changeguard-redis:
